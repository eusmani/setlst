name: Re-alias production domain

# reruns.vercel.app is a system *.vercel.app subdomain — it can't be a project
# production domain, so it does NOT auto-follow deploys. This job waits for the
# git-triggered production deploy of the pushed commit to go READY, then re-points
# reruns.vercel.app at it.

on:
  push:
    branches: [main]

# Don't let two pushes race on the same alias.
concurrency:
  group: realias-${{ github.ref }}
  cancel-in-progress: false

jobs:
  realias:
    runs-on: ubuntu-latest
    steps:
      - name: Wait for production deploy, then re-point reruns.vercel.app
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          TEAM_ID: team_WgfTRzAlZ5jCqdhMOQQroKyx
          PROJECT_ID: prj_N9YghWij11BNl08DJmtUPN4yWpmw
          ALIAS: reruns.vercel.app
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "${VERCEL_TOKEN:-}" ]; then
            echo "::error::VERCEL_TOKEN secret is not set. Add it in repo Settings -> Secrets and variables -> Actions."
            exit 1
          fi
          base="https://api.vercel.com"
          api() { curl -sf -H "Authorization: Bearer $VERCEL_TOKEN" "$@"; }

          echo "Looking for production deployment of commit $SHA ..."
          url=""; state=""
          for i in $(seq 1 60); do
            resp=$(api "$base/v6/deployments?projectId=$PROJECT_ID&teamId=$TEAM_ID&target=production&meta-githubCommitSha=$SHA&limit=1" || true)
            url=$(echo "$resp" | jq -r '.deployments[0].url // empty')
            state=$(echo "$resp" | jq -r '.deployments[0].state // empty')
            echo "[$((i*10))s] url=${url:-none} state=${state:-none}"
            case "$state" in
              READY) break ;;
              ERROR|CANCELED) echo "::error::Deployment $state — not aliasing."; exit 1 ;;
            esac
            sleep 10
          done

          if [ -z "$url" ] || [ "$state" != "READY" ]; then
            echo "::error::Timed out waiting for a READY production deploy of $SHA."
            exit 1
          fi

          # Assign via the Vercel CLI — it handles re-pointing the system *.vercel.app
          # alias, which the raw REST deployments/aliases endpoint rejects.
          echo "Aliasing $url -> $ALIAS"
          npm i -g vercel@latest >/dev/null 2>&1
          # No --scope: the project lives under a personal account, which the CLI
          # refuses as an explicit scope. The token already carries the right context.
          vercel alias set "$url" "$ALIAS" --token="$VERCEL_TOKEN" --yes

          echo "reruns.vercel.app now points at $url"
