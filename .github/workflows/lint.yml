name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # postinstall runs `prisma generate` (no DB needed) so the generated client
      # exists for the type-aware lint.
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint
        run: npm run lint
